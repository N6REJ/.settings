group:
  # ---------------------------------------------------------------
  # Common community files for N6REJ repos.
  #
  # Files are listed explicitly (rather than syncing the whole .common
  # directory) so that adding a file to .common does not silently push it
  # to every repository. Add new entries here on purpose.
  #
  # Repository-owned files are intentionally NOT in this list and are
  # therefore never overwritten, for example:
  #   - ISSUE_TEMPLATE/config.yml  (each repo links its own security policy)
  #
  # The changelog automation files are excluded here and delivered by the
  # dedicated group below, so repos that do not publish releases can simply
  # be left out of that group.
  # ---------------------------------------------------------------
  - files:
      - source: .common/CODEOWNERS
        dest: .github/CODEOWNERS
      - source: .common/CODE_OF_CONDUCT.md
        dest: .github/CODE_OF_CONDUCT.md
      - source: .common/CONTRIBUTING.md
        dest: .github/CONTRIBUTING.md
      - source: .common/FUNDING.yml
        dest: .github/FUNDING.yml
      - source: .common/PULL_REQUEST_TEMPLATE.md
        dest: .github/PULL_REQUEST_TEMPLATE.md
      - source: .common/SECURITY.md
        dest: .github/SECURITY.md
      - source: .common/SUPPORT.md
        dest: .github/SUPPORT.md
      - source: .common/ISSUE_TEMPLATE/bug_report.md
        dest: .github/ISSUE_TEMPLATE/bug_report.md
      - source: .common/ISSUE_TEMPLATE/feature_request.md
        dest: .github/ISSUE_TEMPLATE/feature_request.md
      - source: .common/ISSUE_TEMPLATE/question.md
        dest: .github/ISSUE_TEMPLATE/question.md
    repos: |
        N6REJ/bears_aichatbot
        N6REJ/Bears-ADA-Clock
        N6REJ/joomla-packager
        N6REJ/mod_bears_pricing_tables
        N6REJ/mod_bearsclock
        N6REJ/mod_bearsfaq
        N6REJ/mod_bearslivesearch
        N6REJ/mod_julianclock
        N6REJ/Taskbar-Killer
        N6REJ/winkill
        N6REJ/repo-file-sync-action
        N6REJ/curseforge-downloads-action

  # Changelog automation — only repos that publish releases.
  - files:
      - source: .common/workflows/changelog.yml
        dest: .github/workflows/changelog.yml
      - source: .common/release.yml
        dest: .github/release.yml
    repos: |
        N6REJ/bears_aichatbot
        N6REJ/Bears-ADA-Clock
        N6REJ/joomla-packager
        N6REJ/mod_bears_pricing_tables
        N6REJ/mod_bearsclock
        N6REJ/mod_bearsfaq
        N6REJ/mod_bearslivesearch
        N6REJ/mod_julianclock
        N6REJ/Taskbar-Killer
        N6REJ/winkill
        N6REJ/repo-file-sync-action
        N6REJ/curseforge-downloads-action
